<body>
    <div class="dashboard" id="app">
        <!-- header -->
        <div class="header">
            <h1>维卡统考 · 选择题答案</h1>
            <div class="sub"><i>AI 整理 · 精准分析</i> &nbsp;|&nbsp; 3991/4/17</div>
        </div>

        <!-- 卡片网格 (由 js 动态填充) -->
        <div class="grid" id="cardGrid"></div>

        <!-- footer -->
        <div class="footer">
            <div class="badge"><i>✦</i> 由 AI 自动生成 · 数据源自考生答题卡 <i>✦</i></div>
        </div>
    </div>

    <script>
        (function() {
            // -------------- 原始数据 --------------
            const subjects = [
                {
                    name: '语文',
                    fullScore: 33,
                    answerStr: 'ADAAD CBABC A'
                },
                {
                    name: '数学',
                    fullScore: 30,
                    answerStr: 'AABAA CCDCC'
                },
                {
                    name: '英语',
                    fullScore: 80,
                    answerStr: `ACAAB CCCBBCA BBC AAC BBCC ACC
                              BBCDD DACBA
                              ABCCD DDAAB CCABD
                              BADCA DBADC ABCDC`
                },
                {
                    name: '物理',
                    fullScore: 36,
                    answerStr: 'BACCD ADBAC BA'
                },
                {
                    name: '化学',
                    fullScore: 24,
                    answerStr: 'ABCCD BAC'
                },
                {
                    name: '历史',
                    fullScore: 28,
                    answerStr: 'ABDCC ABDCA DCAC'
                },
                {
                    name: '道德与法治',
                    fullScore: 28,
                    answerStr: 'BBABB CDBCA CBBA'
                }
            ];

            // 总成绩
            const totalScore = subjects.reduce((acc, s) => acc + s.fullScore, 0);

            // -------------- 工具函数 --------------
            // 从答案字符串中提取有效字母 (A-Z, 忽略空格、换行、数字)
            function extractLetters(str) {
                return str.replace(/[^A-Za-z]/g, '').toUpperCase().split('');
            }

            // 渲染单个科目卡片
            function renderCard(subject) {
                const letters = extractLetters(subject.answerStr);
                const card = document.createElement('div');
                card.className = 'card';

                // header
                const header = document.createElement('div');
                header.className = 'card-header';
                header.innerHTML = `
                    <span class="name">${subject.name}</span>
                    <span class="score">${subject.fullScore} 分</span>
                `;
                card.appendChild(header);

                // 答案网格
                const grid = document.createElement('div');
                grid.className = 'answer-grid';

                letters.forEach((letter, idx) => {
                    const item = document.createElement('div');
                    item.className = 'answer-item';
                    item.innerHTML = `
                        <span class="num">${idx + 1}</span>
                        <span class="val">${letter}</span>
                    `;
                    grid.appendChild(item);
                });

                card.appendChild(grid);
                return card;
            }

            // -------------- 渲染 --------------
            const gridContainer = document.getElementById('cardGrid');

            // 清空并填充
            gridContainer.innerHTML = '';

            subjects.forEach(sub => {
                gridContainer.appendChild(renderCard(sub));
            });

            // ---- 总分卡片 (单独构造) ----
            const totalCard = document.createElement('div');
            totalCard.className = 'card total';
            totalCard.innerHTML = `
                <span class="total-label">选择题总分</span>
                <span>
                    <span class="total-score">${totalScore}</span>
                    <span class="total-detail">/ 259</span>
                </span>
            `;
            gridContainer.appendChild(totalCard);

            // ---- 可选：额外展示“AI 置信度”装饰，已包含在 footer ----
        })();
    </script>
